version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@vitejs/*",
            "@testing-library/*",
            "jsdom",
            "@playwright/test",
            "@axe-core/*",
          ]
      tooling:
        patterns:
          [
            "eslint*",
            "prettier*",
            "typescript",
            "husky",
            "lint-staged",
            "@commitlint/*",
            "tailwindcss",
            "@tailwindcss/*",
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
